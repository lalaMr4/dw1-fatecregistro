<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Formulário</title>
  </head>
  <body>
    <h1>Formulários no HTML5</h1>
    <form method="POST">
      <label for="nome">Nome:</label><br />
      <!-- input text -->
      <input
        name="nome"
        type="text"
        id="nome"
        placeholder="Insira seu nome completo..."
      />
      <br />
      <!--input de email  -->
      <label for="email">E-mail:</label><br />
      <input
        name="email"
        type="email"
        id="email"
        placeholder="Insira seu email..."
      />
      <br />
      <!-- input de senha -->
      <label for="senha">Senha:</label><br />
      <input
        name="senha"
        type="password"
        id="senha"
        placeholder="Insira sua senha..."
      />
      <br /><br />
      <!-- botão de enviar -->
      <input type="submit" value="Cadastrar" />
      <!-- botão de limpar -->
      <input type="reset" value="Limpar" />
    </form>
    <br /><br />
    <hr />
    <h4>Outros inputs:</h4>
    <form>
      <label>Quantidade:</label>
      <!-- input de números -->
      <input type="number" min="0" max="10" /> <br />
      <label>Data:</label><br />
      <!-- input números -->
      <input type="date" /><br /><br />
      <!-- input arquivos -->
      <input type="file" /><br /><br />
      <!-- campo de texto longo -->
      <label>Comentários:</label><br />
      <textarea rows="4" cols="40"></textarea>
      <!-- campo invisivel -->
      <input type="hidden" name="idProduto" value="9" />
      <!-- caixa de seleção -->
      <label>Cursos:</label><br />
      <select name="cursos">
        <option value="1">Programação</option>
        <option value="2">Design Gráfico</option>
        <option value="3">Música</option>
        <option value="4">Enfermagem</option>
      </select>
    </form>
    <br /><br />
    <hr />
    <h2>Exemplo formulário completo:</h2>
    <!-- formulario completo -->
     <h4>Cadastro do usuário</h4>
     <form acrtion="#" methof="POST">
        <fieldset>
            <legend>Dados pessoais:</legend>
            <label for="name">Nome:</label>
            <input type="text" placeholder="Insira seu nome..." id="name" name="name">
            <br>
            <label for="nascimento">Data de nascimento:</label>
            <input type="date">
            <br>
            <label for="sexo">Sexo:</label>
            <!-- radio buttons -->
             <input type="radio" name="sexo">Masculino
             <input type="radio" name="sexo">Feminino
        </fieldset>
        <fieldset>
            <legend>Dados de endereço:</legend>
        </fieldset>
     </form>
  </body>
</html>
