<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inserindo imagens no HTML</title>
</head>
<body>
    <!-- Cabeçalho -->
    <header>
        <h1>Galeria de fotos</h1>
    </header>
    <!-- Conteudo principal -->
    <main>
        <!-- Seções -->
        <section>
        <!-- Inserir imagem do computador-->
         <img src="midias/imagem.jpg" alt="Foto de uma paisagem">
         <!-- inserindo imagens da internet -->
          <img src="https://preview.redd.it/meu-gato-%C3%A9-praticamente-o-gato-do-meme-v0-n9dleoj8dgfc1.jpg?width=640&crop=smart&auto=webp&s=52de2578fe227e639db822d551bba33c6d28a2f1" alt="Imagem meme do gato">
        </section>
        <!-- quebra de linha -->
        <br><br><br>
        <section>
            <!-- imagens aleatoria de banco de imagem -->
             <img src="https://picsum.photos/id/600/300/200" alt="imagem aleatória">
             <img src="https://picsum.photos/id/601/300/200" alt="imagem aleatória">
             <img src="https://picsum.photos/id/602/300/200" alt="imagem aleatória">
             <img src="https://picsum.photos/id/603/300/200" alt="imagem aleatória">
             <img src="https://picsum.photos/id/604/300/200" alt="imagem aleatória">
             <img src="https://picsum.photos/id/605/300/200" alt="imagem aleatória">
             <img src="https://picsum.photos/id/606/300/200" alt="imagem aleatória">
             <img src="https://picsum.photos/id/607/300/200" alt="imagem aleatória">
             <img src="https://picsum.photos/id/608/300/200" alt="imagem aleatória">
             <img src="https://picsum.photos/id/609/300/200" alt="imagem aleatória">
        </section>
    </main>
    <hr>
    <!-- Rodapé -->
    <footer>
        <p>&copy; 2026 - FATEC Registro</p>
    </footer>
</body>
</html>
