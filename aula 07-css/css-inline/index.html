<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS inline</title>
</head>
<body>
    <h1 style="color: crimson;"> Demonstração de CSS inline </h1>
    <p style="color:cornflowerblue; font-size: 36px;">Este parágrafo utiliza CSS inline através do atributo style.</p>

    <p style="color: crimson;
    font-weight: bold;
    background-color:crimson;">Outro parágrafo com múltiplas propriedades CSS inline.</P>

<!-- padding: espaçamento interno/ margin: espaçamento externo -->
    <div style="border: 2px solid cornflowerblue; width: 400px; padding: 10px; margin: 5px;">
        <p style="color: lightpink;">Esta é uma div estilizada com CSS inline.</p>
    </div>

    <h2 style="color: crimson; text-align: center;">
        Título centralizado com cor hexadecimal
    </h2>

    <div style="height: 400px; width: 600px; background-color:orange; color:white; font-size: 32px; text-align: center;">
        Desafio CSS inline.
    </div>
</body>
</html>
